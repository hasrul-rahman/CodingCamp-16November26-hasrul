<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="greeting-section">
        <h1 class="greeting">Hello, <span id="user-name-display"></span>!</h1>
        <p class="datetime" id="datetime-display"></p>
    </header>

    <main class="main-content">
        <section class="theme-toggle-container">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-icon" id="theme-icon">☀️</span>
                <span class="theme-text" id="theme-text">Light</span>
            </button>
        </section>

        <section class="timer-section">
            <h2 class="timer-label">Pomodoro Timer</h2>
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-controls">
                <input type="number" id="duration-input" min="1" max="120" value="25" placeholder="Minutes">
                <button id="start-btn" class="btn btn-primary">Start</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>Stop</button>
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
            </div>
        </section>

        <section class="user-settings-section">
            <h2 class="section-title">User Settings</h2>
            <div class="settings-input">
                <input type="text" id="user-name-input" placeholder="Enter your name">
                <button id="save-name-btn" class="btn btn-primary">Save Name</button>
            </div>
            <button id="clear-name-btn" class="btn btn-tertiary">Clear Name</button>
        </section>

        <section class="todo-section">
            <h2 class="section-title">To-Do List</h2>
            <div class="todo-input">
                <input type="text" id="task-input" placeholder="Add a new task">
                <button id="add-task-btn" class="btn btn-primary">Add</button>
            </div>
            <div class="todo-sort">
                <button id="sort-date-desc-btn" class="btn btn-secondary">Newest First</button>
                <button id="sort-date-asc-btn" class="btn btn-secondary">Oldest First</button>
                <button id="sort-completed-btn" class="btn btn-secondary">Completed First</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </section>

        <section class="quick-links-section">
            <h2 class="section-title">Quick Links</h2>
            <div class="links-input">
                <input type="text" id="link-label-input" placeholder="Label (optional)">
                <input type="url" id="link-url-input" placeholder="Enter URL">
                <button id="add-link-btn" class="btn btn-primary">Add Link</button>
            </div>
            <ul class="link-list" id="link-list"></ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
